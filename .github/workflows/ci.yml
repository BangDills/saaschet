name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile (node:20-bookworm-slim) and the
          # `engines.node` floor in package.json.
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first so an obvious break fails in seconds rather
      # than after a full build.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # No secrets: the app builds without them, and a build that needed
      # real credentials could not run on pull requests from forks anyway.
      - name: Build
        run: npm run build
